<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScaleScene preview</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import '/src/index.css'
      import ScaleScene from '/src/scenes/ScaleScene.jsx'
      import { useReveal } from '/src/hooks/useReveal.js'

      function Preview() {
        useReveal('preview')
        return React.createElement(ScaleScene)
      }
      createRoot(document.getElementById('root')).render(
        React.createElement('main', null, React.createElement(Preview)),
      )
    </script>
  </body>
</html>
